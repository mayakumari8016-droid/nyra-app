              public interface ShotCb { void done(String b64); }

              /* Screenshot (Android 11+) -> chhota JPEG base64 */
              public void shot(final ShotCb cb) {
                  if (Build.VERSION.SDK_INT < 30) { cb.done(null); return; }
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, getMainExecutor(), new AccessibilityService.TakeScreenshotCallback() {
                          @Override public void onSuccess(AccessibilityService.ScreenshotResult r) {
                              try {
                                  Bitmap hw = Bitmap.wrapHardwareBuffer(r.getHardwareBuffer(), r.getColorSpace());
                                  Bitmap b = hw.copy(Bitmap.Config.ARGB_8888, false);
                                  int w = 720;
                                  int h = Math.max(1, Math.round(b.getHeight() * (w / (float) b.getWidth())));
                                  Bitmap sm = Bitmap.createScaledBitmap(b, w, h, true);
                                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                                  sm.compress(Bitmap.CompressFormat.JPEG, 60, bo);
                                  r.getHardwareBuffer().close();
                                  cb.done(Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP));
                              } catch (Exception e) { cb.done(null); }
                          }
                          @Override public void onFailure(int code) { cb.done(null); }
                      });
                  } catch (Exception e) { cb.done(null); }
              }
          }
