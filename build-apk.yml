                          case "tap_text": { if (ac == null) return NOACC; boolean ok = ac.clickText(a.optString("text", "")); return ok ? "tap kar diya" : "screen par ye text nahi mila"; }
                          case "tap_position": { if (ac == null) return NOACC; return ac.tap((float) a.optDouble("x", 0), (float) a.optDouble("y", 0)) ? "tap ho gaya" : "tap nahi hua"; }
                          case "scroll_screen": { if (ac == null) return NOACC; return ac.scroll("down".equals(a.optString("direction", "down"))) ? "scroll ho gaya" : "scroll nahi hua"; }
                          case "press_key": { if (ac == null) return NOACC; return ac.press(a.optString("key", "back")) ? "dab gaya" : "nahi daba"; }
                          case "type_text": { if (ac == null) return NOACC; return ac.typeText(a.optString("text", "")) ? "likh diya" : "koi text box nahi mila"; }
                          default: return "Ye kaam abhi background me nahi ho sakta. App kholo to ho jayega.";
                      }
                  } catch (Exception e) { return "error: " + e.getMessage(); }
              }

              private static String media(Context c, String a) {
                  AudioManager am = (AudioManager) c.getSystemService(Context.AUDIO_SERVICE);
                  int k = -1;
                  switch (a) {
                      case "play": k = KeyEvent.KEYCODE_MEDIA_PLAY; break;
                      case "pause": k = KeyEvent.KEYCODE_MEDIA_PAUSE; break;
                      case "toggle": k = KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE; break;
                      case "next": k = KeyEvent.KEYCODE_MEDIA_NEXT; break;
                      case "previous": k = KeyEvent.KEYCODE_MEDIA_PREVIOUS; break;
                      default: break;
                  }
                  if (k > 0) { am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, k)); am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, k)); }
                  else if (a.equals("vol_up")) am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI);
                  else if (a.equals("vol_down")) am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI);
                  else if (a.equals("mute")) am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_TOGGLE_MUTE, AudioManager.FLAG_SHOW_UI);
                  else return "galat action";
                  return a + " ho gaya";
              }

              private static Intent findLaunch(PackageManager pm, String n, boolean exact) {
                  for (ApplicationInfo ai : pm.getInstalledApplications(0)) {
                      Intent li = pm.getLaunchIntentForPackage(ai.packageName);
                      if (li == null) continue;
                      String l = String.valueOf(pm.getApplicationLabel(ai)).toLowerCase();
                      if (exact ? l.equals(n) : l.contains(n)) return li;
                  }
                  return null;
              }

              private static String app(Context c, String name) {
                  String n = name.trim().toLowerCase();
                  if (n.isEmpty()) return "app ka naam batao";
                  PackageManager pm = c.getPackageManager();
                  Intent i = null;
                  if (n.contains(".")) i = pm.getLaunchIntentForPackage(n);
                  if (i == null) i = findLaunch(pm, n, true);
                  if (i == null) i = findLaunch(pm, n, false);
                  if (i == null) return n + " naam ka app nahi mila";
                  boolean bl = NyraLaunch.blocked(c);
                  NyraLaunch.go(c, i, n, n + " kholne ke liye dabao", false);
                  return bl ? "Android ne background se roka, notification aayi hai, user dabaye" : n + " khul gaya";
              }

              private static String videoId(String q) {
                  try {
                      java.net.URL url = new java.net.URL("https://www.youtube.com/results?search_query=" + Uri.encode(q) + "&sp=EgIQAQ%253D%253D");
                      java.net.HttpURLConnection h = (java.net.HttpURLConnection) url.openConnection();
                      h.setConnectTimeout(8000);
                      h.setReadTimeout(8000);
                      h.setRequestProperty("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36");
                      h.setRequestProperty("Accept-Language", "en-US,en;q=0.9");
                      h.setRequestProperty("Cookie", "CONSENT=YES+1; SOCS=CAI");
                      java.io.InputStream in = h.getInputStream();
                      java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int k, total = 0;
                      while ((k = in.read(buf)) > 0 && total < 1500000) { bo.write(buf, 0, k); total += k; }
                      in.close();
                      String s = bo.toString("UTF-8");
                      java.util.regex.Matcher m = java.util.regex.Pattern.compile("\"videoRenderer\":\\{\"videoId\":\"([A-Za-z0-9_-]{11})\"").matcher(s);
                      if (m.find()) return m.group(1);
                      m = java.util.regex.Pattern.compile("\"videoId\":\"([A-Za-z0-9_-]{11})\"").matcher(s);
                      if (m.find()) return m.group(1);
                  } catch (Exception e) {}
                  return null;
              }

              private static String yt(Context c, String q, boolean play) {
                  String vid = (play && !q.isEmpty()) ? videoId(q) : null;
                  Uri u;
                  if (vid != null) u = Uri.parse("https://www.youtube.com/watch?v=" + vid);
                  else if (q.isEmpty()) u = Uri.parse("https://www.youtube.com/");
                  else u = Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(q));
