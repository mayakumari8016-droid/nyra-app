          package com.nyra.app;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;

          public class NyraService extends Service {
              @Override public IBinder onBind(Intent i) { return null; }

              @Override
              public int onStartCommand(Intent in, int flags, int id) {
                  try {
                      String ch = "nyra_live";
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= 26) {
                          nm.createNotificationChannel(new NotificationChannel(ch, "Nyra", NotificationManager.IMPORTANCE_LOW));
                      }
                      Intent o = new Intent(this, MainActivity.class);
                      o.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_NEW_TASK);
                      PendingIntent pi = PendingIntent.getActivity(this, 0, o, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, ch) : new Notification.Builder(this);
                      b.setContentTitle("Nyra chalu hai").setContentText("Sun rahi hai...")
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now).setContentIntent(pi).setOngoing(true);
                      Notification n = b.build();
                      if (Build.VERSION.SDK_INT >= 30) startForeground(7, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                      else startForeground(7, n);
                  } catch (Exception e) {
                      stopSelf();
                  }
                  return START_STICKY;
              }
          }
