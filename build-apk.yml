              /* Settings panel ka pehla switch (Wi-Fi / Bluetooth). want = null to bas ulta kar do */
              public boolean setFirstSwitch(Boolean want) {
                  AccessibilityNodeInfo r = getRootInActiveWindow();
                  if (r == null) return false;
                  List<AccessibilityNodeInfo> all = new ArrayList<>();
                  collect(r, all, 0);
                  for (AccessibilityNodeInfo n : all) {
                      CharSequence cn = n.getClassName();
                      boolean sw = cn != null && (cn.toString().contains("Switch") || cn.toString().contains("ToggleButton"));
                      if (!sw && !(n.isCheckable() && n.isVisibleToUser())) continue;
                      if (!n.isVisibleToUser()) continue;
                      if (want != null && n.isChecked() == want.booleanValue()) return true;
                      return clickNode(n);
                  }
                  return false;
              }

              public boolean typeText(String s) {
                  AccessibilityNodeInfo r = getRootInActiveWindow();
                  if (r == null) return false;
                  AccessibilityNodeInfo f = r.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                  if (f == null) {
                      List<AccessibilityNodeInfo> all = new ArrayList<>();
                      collect(r, all, 0);
                      for (AccessibilityNodeInfo n : all) { if (n.isEditable()) { f = n; break; } }
                  }
                  if (f == null) return false;
                  Bundle a = new Bundle();
                  a.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, s);
                  return f.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, a);
