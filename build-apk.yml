name: Build Nyra APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Project taiyaar karo
        run: |
          mkdir -p www/icons scripts
          cp index.html www/index.html
          cat > www/manifest.webmanifest <<'EOF'
          {"name":"Nyra","short_name":"Nyra","start_url":"index.html","display":"standalone","background_color":"#dbe6f8","theme_color":"#dbe6f8","icons":[{"src":"icons/icon-192.png","sizes":"192x192","type":"image/png"},{"src":"icons/icon-512.png","sizes":"512x512","type":"image/png"}]}
          EOF
          cat > www/sw.js <<'EOF'
          self.addEventListener("install",e=>self.skipWaiting());
          self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));
          self.addEventListener("fetch",e=>{if(e.request.method!=="GET"||new URL(e.request.url).origin!==location.origin)return;e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))});
          EOF
          cat > mkicon.py <<'EOF'
          import zlib,struct
          def png(n,path):
              rows=b"".join(b"\x00"+bytes([47,111,224])*n for _ in range(n))
              def ch(t,d):
                  c=struct.pack(">I",len(d))+t+d
                  return c+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
              open(path,"wb").write(b"\x89PNG\r\n\x1a\n"+ch(b"IHDR",struct.pack(">IIBBBBB",n,n,8,2,0,0,0))+ch(b"IDAT",zlib.compress(rows))+ch(b"IEND",b""))
          png(192,"www/icons/icon-192.png");png(512,"www/icons/icon-512.png");png(512,"icon.png")
          EOF
          python3 mkicon.py
          cat > package.json <<'EOF'
          {"name":"nyra-app","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"^6.2.0","@capacitor/android":"^6.2.0"},"devDependencies":{"@capacitor/cli":"^6.2.0"}}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.nyra.app","appName":"Nyra","webDir":"www","server":{"androidScheme":"https"}}
          EOF
          cat > scripts/patch.js <<'EOF'
          const fs=require("fs");
          const base="android/app/src/main/";
          const f=base+"AndroidManifest.xml";let x=fs.readFileSync(f,"utf8");
          const P=["INTERNET","ACCESS_NETWORK_STATE","RECORD_AUDIO","MODIFY_AUDIO_SETTINGS","CAMERA","ACCESS_FINE_LOCATION","ACCESS_COARSE_LOCATION","POST_NOTIFICATIONS","VIBRATE","WAKE_LOCK","CALL_PHONE","READ_PHONE_STATE","ANSWER_PHONE_CALLS","READ_CALL_LOG","READ_CONTACTS","SEND_SMS","READ_SMS","RECEIVE_SMS","READ_MEDIA_IMAGES","READ_MEDIA_VIDEO","READ_EXTERNAL_STORAGE","BLUETOOTH","BLUETOOTH_CONNECT","REQUEST_IGNORE_BATTERY_OPTIMIZATIONS","SYSTEM_ALERT_WINDOW","FOREGROUND_SERVICE","FOREGROUND_SERVICE_MICROPHONE","QUERY_ALL_PACKAGES","RECEIVE_BOOT_COMPLETED"];
          let a="";for(const p of P)if(!x.includes("android.permission."+p+'"'))a+='    <uses-permission android:name="android.permission.'+p+'" />\n';
          for(const n of ["camera","microphone","location.gps","telephony","bluetooth"])a+='    <uses-feature android:name="android.hardware.'+n+'" android:required="false" />\n';
          x=x.replace("<application",a+"\n    <application");
          const svc=`
                  <service android:name=".NyraNotifListener" android:exported="true" android:label="Nyra" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter><action android:name="android.service.notification.NotificationListenerService" /></intent-filter>
                  </service>
                  <service android:name=".NyraAccessibility" android:exported="true" android:label="Nyra" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/nyra_a11y" />
                  </service>
                  <service android:name=".NyraVoiceService" android:exported="true" android:label="Nyra" android:permission="android.permission.BIND_VOICE_INTERACTION">
                      <meta-data android:name="android.voice_interaction" android:resource="@xml/nyra_voice" />
                      <intent-filter><action android:name="android.service.voice.VoiceInteractionService" /></intent-filter>
                  </service>
                  <service android:name=".NyraService" android:exported="false" android:foregroundServiceType="microphone" />
                  <service android:name=".NyraSessionService" android:exported="true" android:permission="android.permission.BIND_VOICE_INTERACTION" />
                  <service android:name=".NyraRecognitionService" android:exported="true" android:label="Nyra">
                      <intent-filter><action android:name="android.speech.RecognitionService" /><category android:name="android.intent.category.DEFAULT" /></intent-filter>
                  </service>
          `;
          x=x.replace("</application>",svc+"    </application>");
          fs.writeFileSync(f,x);
          fs.mkdirSync(base+"res/xml",{recursive:true});
          fs.writeFileSync(base+"res/xml/nyra_a11y.xml",`<?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/nyra_a11y_desc"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="100" />
          `);
          fs.writeFileSync(base+"res/xml/nyra_voice.xml",`<?xml version="1.0" encoding="utf-8"?>
          <voice-interaction-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:sessionService="com.nyra.app.NyraSessionService"
              android:recognitionService="com.nyra.app.NyraRecognitionService"
              android:supportsAssist="true" />
          `);
          const sf=base+"res/values/strings.xml";let st=fs.readFileSync(sf,"utf8");
          st=st.replace("</resources>",'    <string name="nyra_a11y_desc">Nyra ko apps khol kar aur screen padh kar tumhare liye kaam karne deta hai.</string>\n</resources>');
          fs.writeFileSync(sf,st);
          EOF
      - run: npm install
      - run: npx cap add android
      - name: Native permission plugin aur services
        run: |
          mkdir -p android/app/src/main/java/com/nyra/app
          cat > android/app/src/main/java/com/nyra/app/MainActivity.java <<'EOF'
          package com.nyra.app;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle b) {
                  registerPlugin(NyraPerms.class);
                  registerPlugin(NyraActions.class);
                  super.onCreate(b);
              }
          }
          EOF
          cat > android/app/src/main/java/com/nyra/app/NyraPerms.java <<'EOF'
          package com.nyra.app;
          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;
          import androidx.core.app.NotificationManagerCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.List;

          @CapacitorPlugin(name = "NyraPerms", permissions = {
              @Permission(alias = "mic", strings = { "android.permission.RECORD_AUDIO" }),
              @Permission(alias = "notif", strings = { "android.permission.POST_NOTIFICATIONS" }),
              @Permission(alias = "cam", strings = { "android.permission.CAMERA" }),
              @Permission(alias = "phone", strings = { "android.permission.CALL_PHONE" }),
              @Permission(alias = "contacts", strings = { "android.permission.READ_CONTACTS" }),
              @Permission(alias = "sms", strings = { "android.permission.SEND_SMS", "android.permission.READ_SMS", "android.permission.RECEIVE_SMS" }),
              @Permission(alias = "loc", strings = { "android.permission.ACCESS_FINE_LOCATION", "android.permission.ACCESS_COARSE_LOCATION" }),
              @Permission(alias = "media", strings = { "android.permission.READ_MEDIA_IMAGES", "android.permission.READ_MEDIA_VIDEO" }),
              @Permission(alias = "storage", strings = { "android.permission.READ_EXTERNAL_STORAGE" }),
              @Permission(alias = "calls", strings = { "android.permission.ANSWER_PHONE_CALLS", "android.permission.READ_PHONE_STATE", "android.permission.READ_CALL_LOG" }),
              @Permission(alias = "bt", strings = { "android.permission.BLUETOOTH_CONNECT" })
          })
          public class NyraPerms extends Plugin {
              private static final String[] RT = { "mic", "notif", "cam", "phone", "contacts", "sms", "loc", "media", "calls", "bt" };

              private String[] perms(String a) {
                  int sdk = Build.VERSION.SDK_INT;
                  switch (a) {
                      case "mic": return new String[] { "android.permission.RECORD_AUDIO" };
                      case "notif": return sdk >= 33 ? new String[] { "android.permission.POST_NOTIFICATIONS" } : new String[0];
                      case "cam": return new String[] { "android.permission.CAMERA" };
                      case "phone": return new String[] { "android.permission.CALL_PHONE" };
                      case "contacts": return new String[] { "android.permission.READ_CONTACTS" };
                      case "sms": return new String[] { "android.permission.SEND_SMS", "android.permission.READ_SMS", "android.permission.RECEIVE_SMS" };
                      case "loc": return new String[] { "android.permission.ACCESS_FINE_LOCATION", "android.permission.ACCESS_COARSE_LOCATION" };
                      case "media":
                          return sdk >= 33
                              ? new String[] { "android.permission.READ_MEDIA_IMAGES", "android.permission.READ_MEDIA_VIDEO" }
                              : new String[] { "android.permission.READ_EXTERNAL_STORAGE" };
                      case "calls":
                          return sdk >= 26
                              ? new String[] { "android.permission.ANSWER_PHONE_CALLS", "android.permission.READ_PHONE_STATE", "android.permission.READ_CALL_LOG" }
                              : new String[] { "android.permission.READ_PHONE_STATE", "android.permission.READ_CALL_LOG" };
                      case "bt": return sdk >= 31 ? new String[] { "android.permission.BLUETOOTH_CONNECT" } : new String[0];
                      default: return new String[0];
                  }
              }

              private boolean granted(String a) {
                  for (String p : perms(a)) {
                      if (ContextCompat.checkSelfPermission(getContext(), p) != PackageManager.PERMISSION_GRANTED) return false;
                  }
                  return true;
              }

              private JSObject status() {
                  JSObject o = new JSObject();
                  for (String a : RT) o.put(a, granted(a));
                  Context c = getContext();
                  String pk = c.getPackageName();
                  boolean b = false, ov = false, na = false, ac = false, as = false;
                  try { b = ((PowerManager) c.getSystemService(Context.POWER_SERVICE)).isIgnoringBatteryOptimizations(pk); } catch (Exception e) {}
                  try { ov = Settings.canDrawOverlays(c); } catch (Exception e) {}
                  try { na = NotificationManagerCompat.getEnabledListenerPackages(c).contains(pk); } catch (Exception e) {}
                  try {
                      String s = Settings.Secure.getString(c.getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                      ac = s != null && s.contains(pk + "/");
                  } catch (Exception e) {}
                  try {
                      String s = Settings.Secure.getString(c.getContentResolver(), "assistant");
                      as = s != null && s.contains(pk + "/");
                  } catch (Exception e) {}
                  o.put("battery", b);
                  o.put("overlay", ov);
                  o.put("notif_access", na);
                  o.put("a11y", ac);
                  o.put("assistant", as);
                  return o;
              }

              @PluginMethod
              public void status(PluginCall call) {
                  call.resolve(status());
              }

              @PluginMethod
              public void request(PluginCall call) {
                  String n = call.getString("name", "all");
                  List<String> names = n.equals("all") ? Arrays.asList(RT) : Collections.singletonList(n);
                  List<String> al = new ArrayList<>();
                  for (String a : names) {
                      if (perms(a).length > 0 && !granted(a)) {
                          al.add(a.equals("media") && Build.VERSION.SDK_INT < 33 ? "storage" : a);
                      }
                  }
                  if (al.isEmpty()) {
                      call.resolve(status());
                      return;
                  }
                  requestPermissionForAliases(al.toArray(new String[0]), call, "permCb");
              }

              @PermissionCallback
              private void permCb(PluginCall call) {
                  call.resolve(status());
              }

              @PluginMethod
              public void openSetting(PluginCall call) {
                  String n = call.getString("name", "");
                  String pk = getContext().getPackageName();
                  try {
                      Intent i;
                      switch (n) {
                          case "battery": i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + pk)); break;
                          case "overlay": i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + pk)); break;
                          case "notif_access": i = new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"); break;
                          case "a11y": i = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS); break;
                          case "assistant": i = new Intent(Settings.ACTION_VOICE_INPUT_SETTINGS); break;
                          default: i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + pk));
                      }
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      try {
                          Intent f = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + pk));
                          f.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(f);
                      } catch (Exception e2) {}
                      call.resolve();
                  }
              }
          }
          EOF
          cat > android/app/src/main/java/com/nyra/app/NyraNotifListener.java <<'EOF'
          package com.nyra.app;
          import android.service.notification.NotificationListenerService;
          public class NyraNotifListener extends NotificationListenerService {
          }
          EOF
          cat > android/app/src/main/java/com/nyra/app/NyraAccessibility.java <<'EOF'
          package com.nyra.app;
          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Path;
          import android.graphics.Rect;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.Display;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import java.io.ByteArrayOutputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class NyraAccessibility extends AccessibilityService {
              public static volatile NyraAccessibility inst;
              public static volatile String lastPkg = "";

              @Override protected void onServiceConnected() { inst = this; }
              @Override public boolean onUnbind(Intent i) { inst = null; return super.onUnbind(i); }
              @Override public void onAccessibilityEvent(AccessibilityEvent e) {
                  if (e != null && e.getPackageName() != null) lastPkg = e.getPackageName().toString();
              }
              @Override public void onInterrupt() {}

              private void collect(AccessibilityNodeInfo n, List<AccessibilityNodeInfo> out, int depth) {
                  if (n == null || out.size() > 1500 || depth > 60) return;
                  out.add(n);
                  for (int i = 0; i < n.getChildCount(); i++) collect(n.getChild(i), out, depth + 1);
              }

              public String dump() {
                  AccessibilityNodeInfo r = getRootInActiveWindow();
                  if (r == null) return "";
                  List<AccessibilityNodeInfo> all = new ArrayList<>();
                  collect(r, all, 0);
                  StringBuilder sb = new StringBuilder("app: " + r.getPackageName() + "\n");
                  Rect b = new Rect();
                  for (AccessibilityNodeInfo n : all) {
                      CharSequence t = n.getText();
                      CharSequence d = n.getContentDescription();
                      String s = (t != null && t.length() > 0) ? t.toString() : (d != null ? d.toString() : "");
                      if (s.isEmpty() || !n.isVisibleToUser()) continue;
                      n.getBoundsInScreen(b);
                      sb.append(n.isClickable() ? "[tap] " : "").append(s.replace("\n", " "))
                        .append(" @").append(b.centerX()).append(",").append(b.centerY()).append("\n");
                      if (sb.length() > 6000) break;
                  }
                  return sb.toString();
              }

              private boolean clickNode(AccessibilityNodeInfo n) {
                  AccessibilityNodeInfo c = n;
                  for (int i = 0; i < 8 && c != null; i++) {
                      if (c.isClickable() && c.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true;
                      c = c.getParent();
                  }
                  Rect b = new Rect();
                  n.getBoundsInScreen(b);
                  return tap(b.centerX(), b.centerY());
              }

              public boolean clickText(String t) {
                  AccessibilityNodeInfo r = getRootInActiveWindow();
                  if (r == null || t == null || t.isEmpty()) return false;
                  List<AccessibilityNodeInfo> l = r.findAccessibilityNodeInfosByText(t);
                  if (l == null) return false;
                  for (AccessibilityNodeInfo n : l) {
                      if (n.isVisibleToUser() && clickNode(n)) return true;
                  }
                  return false;
              }

              /* YouTube search results me sabse upar wala video dabata hai */
              public boolean clickFirstVideo() {
                  AccessibilityNodeInfo r = getRootInActiveWindow();
                  if (r == null) return false;
                  List<AccessibilityNodeInfo> all = new ArrayList<>();
                  collect(r, all, 0);
                  AccessibilityNodeInfo best = null;
                  int bestTop = Integer.MAX_VALUE;
                  Rect b = new Rect();
                  for (AccessibilityNodeInfo n : all) {
                      CharSequence d = n.getContentDescription();
                      if (d == null) continue;
                      String s = d.toString().toLowerCase();
                      boolean video = s.contains("play video") || (s.contains("views") && (s.contains("minute") || s.contains("second")));
                      if (!video || s.contains("sponsored")) continue;
                      n.getBoundsInScreen(b);
                      if (b.height() > 100 && b.top < bestTop) { bestTop = b.top; best = n; }
                  }
                  return best != null && clickNode(best);
              }

              public boolean tap(float x, float y) {
                  Path p = new Path();
                  p.moveTo(x, y);
                  GestureDescription g = new GestureDescription.Builder()
                      .addStroke(new GestureDescription.StrokeDescription(p, 0, 60)).build();
                  return dispatchGesture(g, null, null);
              }

              public boolean swipe(float x1, float y1, float x2, float y2) {
                  Path p = new Path();
                  p.moveTo(x1, y1);
                  p.lineTo(x2, y2);
                  GestureDescription g = new GestureDescription.Builder()
                      .addStroke(new GestureDescription.StrokeDescription(p, 0, 300)).build();
                  return dispatchGesture(g, null, null);
              }

              public boolean scroll(boolean down) {
                  int w = getResources().getDisplayMetrics().widthPixels;
                  int h = getResources().getDisplayMetrics().heightPixels;
                  return down ? swipe(w / 2f, h * 0.72f, w / 2f, h * 0.28f) : swipe(w / 2f, h * 0.28f, w / 2f, h * 0.72f);
              }

              public boolean press(String k) {
                  switch (k) {
                      case "back": return performGlobalAction(GLOBAL_ACTION_BACK);
                      case "home": return performGlobalAction(GLOBAL_ACTION_HOME);
                      case "recents": return performGlobalAction(GLOBAL_ACTION_RECENTS);
                      case "notifications": return performGlobalAction(GLOBAL_ACTION_NOTIFICATIONS);
                      default: return false;
                  }
              }

              public boolean typeText(String s) {
                  AccessibilityNodeInfo r = getRootInActiveWindow();
                  if (r == null) return false;
                  AccessibilityNodeInfo f = r.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                  if (f == null) {
                      List<AccessibilityNodeInfo> all = new ArrayList<>();
                      collect(r, all, 0);
                      for (AccessibilityNodeInfo n : all) { if (n.isEditable()) { f = n; break; } }
                  }
                  if (f == null) return false;
                  Bundle a = new Bundle();
                  a.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, s);
                  return f.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, a);
              }

              public interface ShotCb { void done(String b64); }

              /* Screenshot (Android 11+) -> chhota JPEG base64 */
              public void shot(final ShotCb cb) {
                  if (Build.VERSION.SDK_INT < 30) { cb.done(null); return; }
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, getMainExecutor(), new AccessibilityService.TakeScreenshotCallback() {
                          @Override public void onSuccess(AccessibilityService.ScreenshotResult r) {
                              try {
                                  Bitmap hw = Bitmap.wrapHardwareBuffer(r.getHardwareBuffer(), r.getColorSpace());
                                  Bitmap b = hw.copy(Bitmap.Config.ARGB_8888, false);
                                  int w = 720;
                                  int h = Math.max(1, Math.round(b.getHeight() * (w / (float) b.getWidth())));
                                  Bitmap sm = Bitmap.createScaledBitmap(b, w, h, true);
                                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                                  sm.compress(Bitmap.CompressFormat.JPEG, 60, bo);
                                  r.getHardwareBuffer().close();
                                  cb.done(Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP));
                              } catch (Exception e) { cb.done(null); }
                          }
                          @Override public void onFailure(int code) { cb.done(null); }
                      });
                  } catch (Exception e) { cb.done(null); }
              }
          }
          EOF
          cat > android/app/src/main/java/com/nyra/app/NyraActions.java <<'EOF'
          package com.nyra.app;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Build;
          import android.view.KeyEvent;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "NyraActions")
          public class NyraActions extends Plugin {
              private static final String NOACC = "Accessibility service on nahi hai. Menu > Permissions me Accessibility me Nyra on karo.";

              private JSObject res(boolean ok, String msg) {
                  JSObject o = new JSObject();
                  o.put("ok", ok);
                  o.put("msg", msg);
                  return o;
              }

              private void sleep(long ms) {
                  try { Thread.sleep(ms); } catch (InterruptedException e) {}
              }

              private Intent findLaunch(PackageManager pm, String n, boolean exact) {
                  for (ApplicationInfo ai : pm.getInstalledApplications(0)) {
                      Intent li = pm.getLaunchIntentForPackage(ai.packageName);
                      if (li == null) continue;
                      String l = String.valueOf(pm.getApplicationLabel(ai)).toLowerCase();
                      if (exact ? l.equals(n) : l.contains(n)) return li;
                  }
                  return null;
              }

              @PluginMethod
              public void openApp(PluginCall call) {
                  String n = call.getString("name", "").trim().toLowerCase();
                  if (n.isEmpty()) { call.resolve(res(false, "app ka naam batao")); return; }
                  PackageManager pm = getContext().getPackageManager();
                  Intent i = null;
                  if (n.contains(".")) i = pm.getLaunchIntentForPackage(n);
                  if (i == null) i = findLaunch(pm, n, true);
                  if (i == null) i = findLaunch(pm, n, false);
                  if (i == null) { call.resolve(res(false, n + " naam ka app nahi mila")); return; }
                  try {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve(res(true, n + " khul gaya"));
                  } catch (Exception e) {
                      call.resolve(res(false, "app nahi khula: " + e.getMessage()));
                  }
              }

              @PluginMethod
              public void youtube(final PluginCall call) {
                  final String q = call.getString("query", "");
                  final boolean play = Boolean.TRUE.equals(call.getBoolean("play", false));
                  final Context c = getContext();
                  try {
                      Uri u = q.isEmpty() ? Uri.parse("https://www.youtube.com/") : Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(q));
                      Intent i = new Intent(Intent.ACTION_VIEW, u);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      i.setPackage("com.google.android.youtube");
                      try { c.startActivity(i); }
                      catch (ActivityNotFoundException e) { i.setPackage(null); c.startActivity(i); }
                  } catch (Exception e) {
                      call.resolve(res(false, "YouTube nahi khula: " + e.getMessage()));
                      return;
                  }
                  if (!play || q.isEmpty()) { call.resolve(res(true, "YouTube khul gaya")); return; }
                  new Thread(new Runnable() {
                      @Override public void run() {
                          if (NyraAccessibility.inst == null) {
                              call.resolve(res(true, "YouTube khul gaya, par video apne aap chalane ke liye Accessibility on chahiye"));
                              return;
                          }
                          sleep(3500);
                          boolean ok = false;
                          for (int k = 0; k < 8 && !ok; k++) {
                              NyraAccessibility a = NyraAccessibility.inst;
                              if (a != null) ok = a.clickFirstVideo();
                              if (!ok) sleep(1000);
                          }
                          call.resolve(res(ok, ok ? "video chala diya: " + q : "search khul gaya par video nahi dabaya ja saka, read_screen se dekh kar tap_text karo"));
                      }
                  }).start();
              }

              @PluginMethod
              public void media(PluginCall call) {
                  String a = call.getString("action", "toggle");
                  AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                  int k = -1;
                  switch (a) {
                      case "play": k = KeyEvent.KEYCODE_MEDIA_PLAY; break;
                      case "pause": k = KeyEvent.KEYCODE_MEDIA_PAUSE; break;
                      case "toggle": k = KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE; break;
                      case "next": k = KeyEvent.KEYCODE_MEDIA_NEXT; break;
                      case "previous": k = KeyEvent.KEYCODE_MEDIA_PREVIOUS; break;
                      default: break;
                  }
                  if (k > 0) {
                      am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, k));
                      am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, k));
                  } else if (a.equals("vol_up")) {
                      am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI);
                  } else if (a.equals("vol_down")) {
                      am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI);
                  } else if (a.equals("mute")) {
                      am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_TOGGLE_MUTE, AudioManager.FLAG_SHOW_UI);
                  } else {
                      call.resolve(res(false, "galat action"));
                      return;
                  }
                  call.resolve(res(true, a + " ho gaya"));
              }

              @PluginMethod
              public void screen(PluginCall call) {
                  NyraAccessibility a = NyraAccessibility.inst;
                  if (a == null) { call.resolve(res(false, NOACC)); return; }
                  String d = a.dump();
                  call.resolve(res(true, d.isEmpty() ? "screen khaali ya padhi nahi ja saki" : d));
              }

              @PluginMethod
              public void screenshot(final PluginCall call) {
                  NyraAccessibility a = NyraAccessibility.inst;
                  if (a == null) { call.resolve(res(false, NOACC)); return; }
                  if (Build.VERSION.SDK_INT < 30) { call.resolve(res(false, "screenshot Android 11 se upar chalta hai")); return; }
                  a.shot(new NyraAccessibility.ShotCb() {
                      @Override public void done(String b64) {
                          if (b64 == null) { call.resolve(res(false, "screenshot nahi mila")); return; }
                          JSObject o = res(true, "ok");
                          o.put("data", b64);
                          call.resolve(o);
                      }
                  });
              }

              @PluginMethod
              public void tapText(PluginCall call) {
                  NyraAccessibility a = NyraAccessibility.inst;
                  if (a == null) { call.resolve(res(false, NOACC)); return; }
                  String t = call.getString("text", "");
                  boolean ok = a.clickText(t);
                  call.resolve(res(ok, ok ? "tap kar diya: " + t : "screen par '" + t + "' nahi mila"));
              }

              @PluginMethod
              public void tapXY(PluginCall call) {
                  NyraAccessibility a = NyraAccessibility.inst;
                  if (a == null) { call.resolve(res(false, NOACC)); return; }
                  Double x = call.getDouble("x", 0.0);
                  Double y = call.getDouble("y", 0.0);
                  boolean ok = a.tap(x.floatValue(), y.floatValue());
                  call.resolve(res(ok, ok ? "tap ho gaya" : "tap nahi hua"));
              }

              @PluginMethod
              public void scroll(PluginCall call) {
                  NyraAccessibility a = NyraAccessibility.inst;
                  if (a == null) { call.resolve(res(false, NOACC)); return; }
                  boolean ok = a.scroll("down".equals(call.getString("direction", "down")));
                  call.resolve(res(ok, ok ? "scroll ho gaya" : "scroll nahi hua"));
              }

              @PluginMethod
              public void press(PluginCall call) {
                  NyraAccessibility a = NyraAccessibility.inst;
                  if (a == null) { call.resolve(res(false, NOACC)); return; }
                  String k = call.getString("key", "back");
                  boolean ok = a.press(k);
                  call.resolve(res(ok, ok ? k + " dab gaya" : "nahi daba"));
              }

              @PluginMethod
              public void typeText(PluginCall call) {
                  NyraAccessibility a = NyraAccessibility.inst;
                  if (a == null) { call.resolve(res(false, NOACC)); return; }
                  boolean ok = a.typeText(call.getString("text", ""));
                  call.resolve(res(ok, ok ? "likh diya" : "koi text box nahi mila"));
              }

              @PluginMethod
              public void fg(PluginCall call) {
                  try {
                      Intent i = new Intent(getContext(), NyraService.class);
                      if (Boolean.TRUE.equals(call.getBoolean("on", true))) {
                          if (Build.VERSION.SDK_INT >= 26) getContext().startForegroundService(i);
                          else getContext().startService(i);
                      } else {
                          getContext().stopService(i);
                      }
                  } catch (Exception e) {}
                  call.resolve(res(true, "ok"));
              }
          }
