                  wl = null;
                  hd.removeCallbacks(wd);
                  running = false;
                  inst = null;
                  super.onDestroy();
              }

              /* chhota gol orb: bahar ghoomta ring, beech me ghoomta sitara */
              static class OrbView extends View {
                  volatile boolean talk = false;
                  private float ang = 0f;
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Path star = new Path();
                  private final RectF rc = new RectF();
                  private final ValueAnimator va;

                  OrbView(Context c) {
                      super(c);
                      va = ValueAnimator.ofFloat(0f, 360f);
                      va.setDuration(3000);
                      va.setRepeatCount(ValueAnimator.INFINITE);
                      va.setInterpolator(new LinearInterpolator());
                      va.addUpdateListener(new ValueAnimator.AnimatorUpdateListener() {
                          @Override public void onAnimationUpdate(ValueAnimator a) {
                              ang = (Float) a.getAnimatedValue();
                              invalidate();
                          }
                      });
                  }

                  void start() { if (!va.isStarted()) va.start(); }
                  void stop() { va.cancel(); }

                  @Override
                  protected void onDraw(Canvas cv) {
                      float w = getWidth(), c = w / 2f, d = getResources().getDisplayMetrics().density;
                      float pulse = talk ? 1f + 0.07f * (float) Math.sin(Math.toRadians(ang * 4)) : 1f;
                      float r = c * 0.94f * pulse;
                      p.setStyle(Paint.Style.FILL);
                      p.setShader(new RadialGradient(c, c, r, new int[] { 0xFFFF7AB8, 0xFFC13A96, 0xFF4D1D86, 0x00150D2B },
                          new float[] { 0f, 0.45f, 0.8f, 1f }, Shader.TileMode.CLAMP));
                      cv.drawCircle(c, c, r, p);
                      p.setShader(null);
                      p.setColor(0xFF0F0820);
                      cv.drawCircle(c, c, r * 0.58f, p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(2 * d);
                      p.setColor(0xFFFF9FCF);
                      cv.drawCircle(c, c, r * 0.58f, p);

                      cv.save();
                      cv.rotate(-ang, c, c);
                      p.setStrokeWidth(3 * d);
                      p.setStrokeCap(Paint.Cap.ROUND);
                      p.setShader(new SweepGradient(c, c, new int[] { 0x007EEAD0, 0xFF7EEAD0 }, new float[] { 0f, 0.75f }));
                      rc.set(c - r * 0.8f, c - r * 0.8f, c + r * 0.8f, c + r * 0.8f);
                      cv.drawArc(rc, 0f, 270f, false, p);
                      p.setShader(null);
                      cv.restore();

                      cv.save();
                      cv.rotate(ang / 2f, c, c);
                      star.reset();
                      float R = r * 0.36f, ri = R * 0.38f;
                      for (int i = 0; i < 8; i++) {
                          double a = Math.toRadians(i * 45 - 90);
                          float rr = (i % 2 == 0) ? R : ri;
                          float x = c + (float) Math.cos(a) * rr, y = c + (float) Math.sin(a) * rr;
                          if (i == 0) star.moveTo(x, y); else star.lineTo(x, y);
                      }
                      star.close();
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(0xFFFFD3EA);
                      cv.drawPath(star, p);
                      cv.restore();
                  }
              }
          }
