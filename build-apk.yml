          package com.nyra.app;
          import android.content.Context;
          import android.media.AudioAttributes;
          import android.media.AudioFormat;
          import android.media.AudioRecord;
          import android.media.AudioTrack;
          import android.media.MediaRecorder;
          import android.util.Base64;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.LinkedBlockingQueue;
          import java.util.concurrent.TimeUnit;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;
          import okhttp3.WebSocket;
          import okhttp3.WebSocketListener;
          import okio.ByteString;
          import org.json.JSONArray;
          import org.json.JSONObject;

          /* Background wali call: mic + speaker + Gemini Live socket sab native (WebView ke bina), isliye app peeche ho tab bhi chalti hai */
          public class NyraLive {
              public static volatile boolean on = false;
              public static volatile String cfgKey, cfgSetup;

              public static void say(final String s) {
                  final Context c = ctx;
                  if (c == null) return;
                  new android.os.Handler(android.os.Looper.getMainLooper()).post(new Runnable() {
                      @Override public void run() { try { android.widget.Toast.makeText(c, s, android.widget.Toast.LENGTH_SHORT).show(); } catch (Exception e) {} }
                  });
              }
              private static volatile boolean ready = false;
              private static Context ctx;
              private static String key, setup;
              private static WebSocket ws;
              private static AudioRecord ar;
              private static AudioTrack at;
              private static int tries = 0;
              private static OkHttpClient cl;
              private static final LinkedBlockingQueue<byte[]> q = new LinkedBlockingQueue<>();
              private static final ExecutorService ex = Executors.newCachedThreadPool();

              public static synchronized void start(Context c, String k, String s) {
                  stop();
                  ctx = c.getApplicationContext();
                  key = k;
                  setup = s;
                  on = true;
                  tries = 0;
                  say("Nyra background call shuru ho rahi hai...");
                  connect();
              }

              public static synchronized void stop() {
                  on = false;
                  ready = false;
                  try { if (ws != null) ws.close(1000, null); } catch (Exception e) {}
                  ws = null;
                  closeAudio();
                  q.clear();
                  NyraService.talk(false);
              }

              private static void connect() {
                  if (cl == null) cl = new OkHttpClient.Builder().readTimeout(0, TimeUnit.MILLISECONDS).pingInterval(20, TimeUnit.SECONDS).build();
                  Request r = new Request.Builder().url("wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=" + android.net.Uri.encode(key)).build();
                  ws = cl.newWebSocket(r, new WebSocketListener() {
                      @Override public void onOpen(WebSocket w, Response r) { w.send(setup); }
                      @Override public void onMessage(WebSocket w, String t) { handle(w, t); }
                      @Override public void onMessage(WebSocket w, ByteString b) { handle(w, b.utf8()); }
                      @Override public void onClosed(WebSocket w, int code, String reason) { if (w == ws) say("Call band (" + code + ") " + reason); lost(w); }
                      @Override public void onFailure(WebSocket w, Throwable t, Response r) { if (w == ws) say("Internet/connection error: " + t.getMessage()); lost(w); }
                  });
              }

              private static void lost(final WebSocket w) {
                  if (w != ws || !on) return;
                  ready = false;
                  closeAudio();
                  if (tries++ < 3) {
                      ex.execute(new Runnable() {
                          @Override public void run() {
                              try { Thread.sleep(1500); } catch (Exception e) {}
                              if (on) connect();
                          }
                      });
                  } else {
                      on = false;
                      say("Background call band ho gayi, app kholo");
                  }
              }

              private static void handle(final WebSocket w, String t) {
                  try {
                      JSONObject m = new JSONObject(t);
                      if (m.has("setupComplete")) { ready = true; tries = 0; say("Nyra background me sun rahi hai"); openAudio(); return; }
                      if (m.has("toolCall")) {
                          final JSONArray fc = m.getJSONObject("toolCall").optJSONArray("functionCalls");
                          if (fc == null) return;
                          ex.execute(new Runnable() {
                              @Override public void run() {
                                  try {
                                      JSONArray out = new JSONArray();
                                      say("Nyra kaam kar rahi hai");
                                      for (int i = 0; i < fc.length(); i++) {
                                          JSONObject f = fc.getJSONObject(i);
                                          String r = NyraTools.run(ctx, f.optString("name"), f.optJSONObject("args") == null ? new JSONObject() : f.optJSONObject("args"));
                                          out.put(new JSONObject().put("id", f.optString("id")).put("name", f.optString("name")).put("response", new JSONObject().put("result", r)));
                                      }
                                      w.send(new JSONObject().put("toolResponse", new JSONObject().put("functionResponses", out)).toString());
                                  } catch (Exception e) {}
                              }
                          });
                          return;
                      }
                      JSONObject sc = m.optJSONObject("serverContent");
                      if (sc == null) return;
                      if (sc.optBoolean("interrupted")) flush();
                      JSONObject mt = sc.optJSONObject("modelTurn");
                      if (mt != null) {
                          JSONArray ps = mt.optJSONArray("parts");
                          if (ps != null) for (int i = 0; i < ps.length(); i++) {
                              JSONObject id = ps.getJSONObject(i).optJSONObject("inlineData");
                              if (id != null && id.optString("data").length() > 0) {
                                  q.offer(Base64.decode(id.getString("data"), Base64.DEFAULT));
                                  NyraService.talk(true);
                              }
                          }
                      }
                      if (sc.optBoolean("turnComplete")) NyraService.talk(false);
                  } catch (Exception e) {}
              }

              private static void flush() {
                  q.clear();
                  try { if (at != null) { at.pause(); at.flush(); at.play(); } } catch (Exception e) {}
                  NyraService.talk(false);
              }

              private static synchronized void openAudio() {
                  closeAudio();
                  try {
                      int min = AudioRecord.getMinBufferSize(16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                      AudioRecord a = new AudioRecord(MediaRecorder.AudioSource.VOICE_COMMUNICATION, 16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, Math.max(min, 3200) * 2);
                      if (a.getState() != AudioRecord.STATE_INITIALIZED) {
                          a.release();
                          a = new AudioRecord(MediaRecorder.AudioSource.MIC, 16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, Math.max(min, 3200) * 2);
                      }
                      a.startRecording();
                      if (a.getRecordingState() != AudioRecord.RECORDSTATE_RECORDING) say("Mic nahi chala (Android ne roka)");
                      ar = a;
                      int tm = AudioTrack.getMinBufferSize(24000, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT);
                      AudioTrack t = new AudioTrack.Builder()
                          .setAudioAttributes(new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                          .setAudioFormat(new AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(24000).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                          .setBufferSizeInBytes(Math.max(tm, 9600) * 2)
                          .setTransferMode(AudioTrack.MODE_STREAM).build();
                      t.play();
                      at = t;
                      final AudioRecord ra = a;
                      final AudioTrack rt = t;
                      final AudioRecord chk = a;
                      ex.execute(new Runnable() {
                          @Override public void run() {
                              try {
                                  Thread.sleep(2500);
                                  if (android.os.Build.VERSION.SDK_INT >= 29 && on && ar == chk) {
                                      android.media.AudioManager am = (android.media.AudioManager) ctx.getSystemService(Context.AUDIO_SERVICE);
                                      for (android.media.AudioRecordingConfiguration c : am.getActiveRecordingConfigurations()) {
                                          if (c.getClientAudioSessionId() == chk.getAudioSessionId() && c.isClientSilenced()) say("Android ne mic silent kar diya (foreground service nahi chal rahi)");
                                      }
                                  }
                              } catch (Throwable e) {}
                          }
                      });
                      new Thread(new Runnable() {
                          @Override public void run() {
                              short[] b = new short[1600];
                              while (on && ready && ar == ra) {
                                  int n = ra.read(b, 0, b.length);
                                  if (n <= 0) continue;
                                  byte[] by = new byte[n * 2];
                                  ByteBuffer.wrap(by).order(ByteOrder.LITTLE_ENDIAN).asShortBuffer().put(b, 0, n);
                                  WebSocket w = ws;
                                  if (w != null) w.send("{\"realtimeInput\":{\"audio\":{\"data\":\"" + Base64.encodeToString(by, Base64.NO_WRAP) + "\",\"mimeType\":\"audio/pcm;rate=16000\"}}}");
                              }
                          }
                      }).start();
                      new Thread(new Runnable() {
                          @Override public void run() {
                              while (on && ready && at == rt) {
                                  try {
                                      byte[] x = q.poll(300, TimeUnit.MILLISECONDS);
                                      if (x != null) rt.write(x, 0, x.length);
                                  } catch (Exception e) { break; }
                              }
                          }
                      }).start();
                  } catch (Throwable e) { say("Audio error: " + e.getMessage()); }
              }

              private static synchronized void closeAudio() {
                  AudioRecord a = ar;
                  AudioTrack t = at;
                  ar = null;
                  at = null;
                  try { if (a != null) { a.stop(); a.release(); } } catch (Exception e) {}
                  try { if (t != null) { t.stop(); t.release(); } } catch (Exception e) {}
              }
          }
