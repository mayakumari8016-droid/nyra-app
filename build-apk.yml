name: Build Nyra APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Project taiyaar karo
        run: |
          mkdir -p www/icons scripts
          if [ -f nyra-app.html ]; then cp nyra-app.html www/index.html; else cp index.html www/index.html; fi
          cat > www/manifest.webmanifest <<'EOF'
          {"name":"Nyra","short_name":"Nyra","start_url":"index.html","display":"standalone","background_color":"#dbe6f8","theme_color":"#dbe6f8","icons":[{"src":"icons/icon-192.png","sizes":"192x192","type":"image/png"},{"src":"icons/icon-512.png","sizes":"512x512","type":"image/png"}]}
          EOF
          cat > www/sw.js <<'EOF'
          self.addEventListener("install",e=>self.skipWaiting());
          self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));
          self.addEventListener("fetch",e=>{if(e.request.method!=="GET"||new URL(e.request.url).origin!==location.origin)return;e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))});
          EOF
          cat > mkicon.py <<'EOF'
          import zlib,struct
          def png(n,path):
              rows=b"".join(b"\x00"+bytes([47,111,224])*n for _ in range(n))
              def ch(t,d):
                  c=struct.pack(">I",len(d))+t+d
                  return c+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
              open(path,"wb").write(b"\x89PNG\r\n\x1a\n"+ch(b"IHDR",struct.pack(">IIBBBBB",n,n,8,2,0,0,0))+ch(b"IDAT",zlib.compress(rows))+ch(b"IEND",b""))
          png(192,"www/icons/icon-192.png");png(512,"www/icons/icon-512.png");png(512,"icon.png")
          EOF
          python3 mkicon.py
          cat > package.json <<'EOF'
          {"name":"nyra-app","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"^6.2.0","@capacitor/android":"^6.2.0"},"devDependencies":{"@capacitor/cli":"^6.2.0"}}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.nyra.app","appName":"Nyra","webDir":"www","server":{"androidScheme":"https"}}
          EOF
          cat > scripts/patch.js <<'EOF'
          const fs=require("fs");
          const base="android/app/src/main/";
          const f=base+"AndroidManifest.xml";let x=fs.readFileSync(f,"utf8");
          const P=["INTERNET","ACCESS_NETWORK_STATE","RECORD_AUDIO","MODIFY_AUDIO_SETTINGS","CAMERA","ACCESS_FINE_LOCATION","ACCESS_COARSE_LOCATION","POST_NOTIFICATIONS","VIBRATE","WAKE_LOCK","USE_FULL_SCREEN_INTENT","CALL_PHONE","READ_PHONE_STATE","ANSWER_PHONE_CALLS","READ_CALL_LOG","READ_CONTACTS","SEND_SMS","READ_SMS","RECEIVE_SMS","READ_MEDIA_IMAGES","READ_MEDIA_VIDEO","READ_EXTERNAL_STORAGE","BLUETOOTH","BLUETOOTH_CONNECT","REQUEST_IGNORE_BATTERY_OPTIMIZATIONS","SYSTEM_ALERT_WINDOW","FOREGROUND_SERVICE","FOREGROUND_SERVICE_MICROPHONE","QUERY_ALL_PACKAGES","RECEIVE_BOOT_COMPLETED","WRITE_SECURE_SETTINGS","MANAGE_EXTERNAL_STORAGE","WRITE_EXTERNAL_STORAGE"];
          let a="";for(const p of P)if(!x.includes("android.permission."+p+'"'))a+='    <uses-permission android:name="android.permission.'+p+'" />\n';
          for(const n of ["camera","microphone","location.gps","telephony","bluetooth"])a+='    <uses-feature android:name="android.hardware.'+n+'" android:required="false" />\n';
          x=x.replace("<application",a+"\n    <application");
          x=x.replace(/<application(\s)/,'<application android:requestLegacyExternalStorage="true"$1');
          const svc=`
                  <service android:name=".NyraNotifListener" android:exported="true" android:label="Nyra" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter><action android:name="android.service.notification.NotificationListenerService" /></intent-filter>
                  </service>
                  <service android:name=".NyraAccessibility" android:exported="true" android:label="Nyra" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/nyra_a11y" />
                  </service>
                  <service android:name=".NyraVoiceService" android:exported="true" android:label="Nyra" android:permission="android.permission.BIND_VOICE_INTERACTION">
                      <meta-data android:name="android.voice_interaction" android:resource="@xml/nyra_voice" />
                      <intent-filter><action android:name="android.service.voice.VoiceInteractionService" /></intent-filter>
                  </service>
                  <service android:name=".NyraService" android:exported="false" android:foregroundServiceType="microphone" />
                  <service android:name=".NyraWake" android:exported="false" android:foregroundServiceType="microphone" />
                  <service android:name=".NyraSessionService" android:exported="true" android:permission="android.permission.BIND_VOICE_INTERACTION" />
                  <service android:name=".NyraRecognitionService" android:exported="true" android:label="Nyra">
                      <intent-filter><action android:name="android.speech.RecognitionService" /><category android:name="android.intent.category.DEFAULT" /></intent-filter>
                  </service>
          `;
          x=x.replace("</application>",svc+"    </application>");
          fs.writeFileSync(f,x);
          fs.mkdirSync(base+"res/xml",{recursive:true});
          fs.writeFileSync(base+"res/xml/nyra_a11y.xml",`<?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/nyra_a11y_desc"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="100" />
          `);
          fs.writeFileSync(base+"res/xml/nyra_voice.xml",`<?xml version="1.0" encoding="utf-8"?>
          <voice-interaction-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:sessionService="com.nyra.app.NyraSessionService"
              android:recognitionService="com.nyra.app.NyraRecognitionService"
              android:supportsAssist="true" />
          `);
          const sf=base+"res/values/strings.xml";let st=fs.readFileSync(sf,"utf8");
          st=st.replace("</resources>",'    <string name="nyra_a11y_desc">Nyra ko apps khol kar aur screen padh kar tumhare liye kaam karne deta hai.</string>\n</resources>');
          fs.writeFileSync(sf,st);
          EOF
      - run: npm install
      - run: npx cap add android
      - name: Offline Hindi awaaz model (Vosk small, ~42 MB)
        run: |
          mkdir -p android/app/src/main/assets
          curl -fL --retry 4 --retry-delay 5 -o hi.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q hi.zip -d hi_tmp
          mv hi_tmp/vosk-model-small-hi-0.22 android/app/src/main/assets/model-hi
          cat /proc/sys/kernel/random/uuid > android/app/src/main/assets/model-hi/uuid
          du -sh android/app/src/main/assets/model-hi
      - name: Vosk library jodo
        run: |
          sed -i '/^dependencies {/a\    implementation "com.alphacephei:vosk-android:0.3.47"\n    implementation "net.java.dev.jna:jna:5.13.0@aar"\n    implementation "com.squareup.okhttp3:okhttp:4.12.0"' android/app/build.gradle
          grep -n "vosk\|jna" android/app/build.gradle
      - name: Native permission plugin aur services
        run: |
          mkdir -p android/app/src/main/java/com/nyra/app
          cat > android/app/src/main/java/com/nyra/app/MainActivity.java <<'EOF'
          package com.nyra.app;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private final Handler hd = new Handler(Looper.getMainLooper());
              private boolean visible = true;
              private final Runnable pk = new Runnable() { @Override public void run() { poke(); } };
              private final Runnable hand = new Runnable() {
                  @Override public void run() {
                      if (!visible && NyraLive.cfgSetup != null && !NyraLive.on) {
                          NyraLive.start(MainActivity.this, NyraLive.cfgKey, NyraLive.cfgSetup);
                          js("window.nyraBg&&window.nyraBg(true)");
                      }
                  }
              };
              private void js(String s) {
                  try { getBridge().getWebView().evaluateJavascript(s, null); } catch (Exception e) {}
              }
              private final Runnable keep = new Runnable() {
                  @Override public void run() {
                      if (!visible && NyraService.running) {
                          poke();
                          hd.postDelayed(this, 700);
                      }
                  }
              };

              @Override
              public void onCreate(Bundle b) {
                  registerPlugin(NyraPerms.class);
                  registerPlugin(NyraActions.class);
                  super.onCreate(b);
                  try {
                      WebView w = getBridge().getWebView();
                      if (w != null) w.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  } catch (Exception e) {}
              }

              /* Android background me WebView ko "hidden" maan kar awaaz/JS rok deta hai.
                 Call chalu ho to use zabardasti visible/resumed rakhte hain taaki mic, speaker aur tools chalte rahein. */
              private void poke() {
                  try {
                      WebView w = getBridge().getWebView();
                      if (w != null) {
                          w.onResume();
                          w.resumeTimers();
                          w.dispatchWindowVisibilityChanged(View.VISIBLE);
                      }
                  } catch (Exception e) {}
              }

              private void wakeJs() {
                  if (!NyraWake.pending) return;
                  int[] d = { 400, 1500, 3500 };
                  for (int ms : d) {
                      hd.postDelayed(new Runnable() {
                          @Override public void run() {
                              try { getBridge().getWebView().evaluateJavascript("window.nyraWake&&window.nyraWake()", null); } catch (Exception e) {}
                          }
                      }, ms);
                  }
              }

              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  wakeJs();
              }

              @Override
              public void onPause() {
                  super.onPause();
                  visible = false;
                  NyraLaunch.appVisible = false;
                  if (NyraService.running) {
                      poke();
                      hd.removeCallbacks(keep);
                      hd.postDelayed(keep, 150);
                      hd.removeCallbacks(hand);
                      hd.postDelayed(hand, 1200);
                      NyraService.showOrb(true);
                  }
                  if (NyraLive.cfgSetup != null) {
                      /* app abhi bhi aage hai, isliye mic wali foreground service yahin pakka chalu karo */
                      try {
                          Intent s = new Intent(this, NyraService.class);
                          if (android.os.Build.VERSION.SDK_INT >= 26) startForegroundService(s); else startService(s);
                      } catch (Exception e) {
                          android.widget.Toast.makeText(this, "Nyra service nahi chali: " + e.getMessage(), android.widget.Toast.LENGTH_LONG).show();
                      }
                      hd.removeCallbacks(hand);
                      hd.postDelayed(hand, 800);
                  }
              }

              @Override
              public void onStop() {
                  super.onStop();
                  if (NyraService.running) {
                      poke();
                      hd.postDelayed(pk, 100);
                      hd.postDelayed(pk, 400);
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  visible = true;
                  NyraLaunch.appVisible = true;
                  NyraLaunch.clear(this);
                  hd.removeCallbacks(keep);
                  hd.removeCallbacks(hand);
                  if (NyraLive.on) NyraLive.stop();
                  hd.postDelayed(new Runnable() { @Override public void run() { js("window.nyraBg&&window.nyraBg(false)"); } }, 300);
                  NyraService.showOrb(false);
                  NyraSecure.ensure(this);
                  wakeJs();
              }
          }
          EOF
          cat > android/app/src/main/java/com/nyra/app/NyraPerms.java <<'EOF'
          package com.nyra.app;
          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.os.PowerManager;
          import android.provider.Settings;
          import androidx.core.app.NotificationManagerCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.List;

          @CapacitorPlugin(name = "NyraPerms", permissions = {
              @Permission(alias = "mic", strings = { "android.permission.RECORD_AUDIO" }),
              @Permission(alias = "notif", strings = { "android.permission.POST_NOTIFICATIONS" }),
              @Permission(alias = "cam", strings = { "android.permission.CAMERA" }),
              @Permission(alias = "phone", strings = { "android.permission.CALL_PHONE" }),
              @Permission(alias = "contacts", strings = { "android.permission.READ_CONTACTS" }),
              @Permission(alias = "sms", strings = { "android.permission.SEND_SMS", "android.permission.READ_SMS", "android.permission.RECEIVE_SMS" }),
              @Permission(alias = "loc", strings = { "android.permission.ACCESS_FINE_LOCATION", "android.permission.ACCESS_COARSE_LOCATION" }),
              @Permission(alias = "media", strings = { "android.permission.READ_MEDIA_IMAGES", "android.permission.READ_MEDIA_VIDEO" }),
              @Permission(alias = "storage", strings = { "android.permission.READ_EXTERNAL_STORAGE", "android.permission.WRITE_EXTERNAL_STORAGE" }),
              @Permission(alias = "calls", strings = { "android.permission.ANSWER_PHONE_CALLS", "android.permission.READ_PHONE_STATE", "android.permission.READ_CALL_LOG" }),
              @Permission(alias = "bt", strings = { "android.permission.BLUETOOTH_CONNECT" })
          })
          public class NyraPerms extends Plugin {
              private static final String[] RT = { "mic", "notif", "cam", "phone", "contacts", "sms", "loc", "media", "calls", "bt", "allfiles" };

              private String[] perms(String a) {
                  int sdk = Build.VERSION.SDK_INT;
                  switch (a) {
                      case "mic": return new String[] { "android.permission.RECORD_AUDIO" };
                      case "notif": return sdk >= 33 ? new String[] { "android.permission.POST_NOTIFICATIONS" } : new String[0];
                      case "cam": return new String[] { "android.permission.CAMERA" };
                      case "phone": return new String[] { "android.permission.CALL_PHONE" };
                      case "contacts": return new String[] { "android.permission.READ_CONTACTS" };
                      case "sms": return new String[] { "android.permission.SEND_SMS", "android.permission.READ_SMS", "android.permission.RECEIVE_SMS" };
                      case "loc": return new String[] { "android.permission.ACCESS_FINE_LOCATION", "android.permission.ACCESS_COARSE_LOCATION" };
                      case "media":
                          return sdk >= 33
                              ? new String[] { "android.permission.READ_MEDIA_IMAGES", "android.permission.READ_MEDIA_VIDEO" }
                              : new String[] { "android.permission.READ_EXTERNAL_STORAGE" };
                      case "calls":
                          return sdk >= 26
                              ? new String[] { "android.permission.ANSWER_PHONE_CALLS", "android.permission.READ_PHONE_STATE", "android.permission.READ_CALL_LOG" }
                              : new String[] { "android.permission.READ_PHONE_STATE", "android.permission.READ_CALL_LOG" };
                      case "allfiles": return sdk >= 30 ? new String[0] : new String[] { "android.permission.WRITE_EXTERNAL_STORAGE", "android.permission.READ_EXTERNAL_STORAGE" };
                      case "bt": return sdk >= 31 ? new String[] { "android.permission.BLUETOOTH_CONNECT" } : new String[0];
                      default: return new String[0];
                  }
              }

              private boolean granted(String a) {
                  if (a.equals("allfiles") && Build.VERSION.SDK_INT >= 30) return Environment.isExternalStorageManager();
                  for (String p : perms(a)) {
                      if (ContextCompat.checkSelfPermission(getContext(), p) != PackageManager.PERMISSION_GRANTED) return false;
                  }
                  return true;
              }

              private JSObject status() {
                  JSObject o = new JSObject();
                  for (String a : RT) o.put(a, granted(a));
                  Context c = getContext();
                  String pk = c.getPackageName();
                  boolean b = false, ov = false, na = false, ac = false, as = false;
                  try { b = ((PowerManager) c.getSystemService(Context.POWER_SERVICE)).isIgnoringBatteryOptimizations(pk); } catch (Exception e) {}
                  try { ov = Settings.canDrawOverlays(c); } catch (Exception e) {}
                  try { na = NotificationManagerCompat.getEnabledListenerPackages(c).contains(pk); } catch (Exception e) {}
                  try {
                      String s = Settings.Secure.getString(c.getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                      ac = s != null && s.contains(pk + "/");
                  } catch (Exception e) {}
                  try {
                      String s = Settings.Secure.getString(c.getContentResolver(), "assistant");
                      as = s != null && s.contains(pk + "/");
                  } catch (Exception e) {}
                  o.put("battery", b);
                  o.put("overlay", ov);
                  o.put("notif_access", na);
                  o.put("a11y", ac);
                  o.put("assistant", as);
                  o.put("secure", NyraSecure.has(c));
                  return o;
              }

              @PluginMethod
              public void status(PluginCall call) {
                  call.resolve(status());
              }

              @PluginMethod
              public void request(PluginCall call) {
                  String n = call.getString("name", "all");
                  List<String> names = n.equals("all") ? Arrays.asList(RT) : Collections.singletonList(n);
                  List<String> al = new ArrayList<>();
                  for (String a : names) {
                      if (perms(a).length > 0 && !granted(a)) {
                          String x = ((a.equals("media") && Build.VERSION.SDK_INT < 33) || a.equals("allfiles")) ? "storage" : a;
                          if (!al.contains(x)) al.add(x);
                      }
                  }
                  if (al.isEmpty()) {
                      call.resolve(status());
                      return;
                  }
                  requestPermissionForAliases(al.toArray(new String[0]), call, "permCb");
              }

              @PermissionCallback
              private void permCb(PluginCall call) {
                  call.resolve(status());
              }

              @PluginMethod
              public void enableA11y(PluginCall call) {
                  boolean ok = NyraSecure.ensure(getContext());
                  JSObject o = status();
                  o.put("ok", ok);
                  o.put("msg", ok ? "Accessibility ON ho gayi" : "Pehle WRITE_SECURE_SETTINGS permission do");
                  call.resolve(o);
              }

              @PluginMethod
              public void rootGrant(final PluginCall call) {
                  new Thread(new Runnable() {
                      @Override public void run() {
                          boolean ok = false;
                          String msg;
                          try {
                              Process p = Runtime.getRuntime().exec(new String[] { "su", "-c", "pm grant " + getContext().getPackageName() + " android.permission.WRITE_SECURE_SETTINGS" });
                              int rc = p.waitFor();
                              ok = rc == 0 && NyraSecure.has(getContext());
                              msg = ok ? "Permission mil gayi" : "Root ne permission nahi di";
                          } catch (Exception e) {
                              msg = "Ye phone rooted nahi hai. Computer wali command use karo.";
                          }
                          if (ok) NyraSecure.ensure(getContext());
                          JSObject o = status();
                          o.put("ok", ok);
                          o.put("msg", msg);
                          call.resolve(o);
                      }
                  }).start();
              }

              @PluginMethod
              public void openSetting(PluginCall call) {
                  String n = call.getString("name", "");
                  String pk = getContext().getPackageName();
                  try {
                      Intent i;
                      switch (n) {
                          case "battery": i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + pk)); break;
                          case "overlay": i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + pk)); break;
                          case "notif_access": i = new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"); break;
                          case "a11y": i = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS); break;
                          case "allfiles": i = Build.VERSION.SDK_INT >= 30 ? new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + pk)) : new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + pk)); break;
                          case "assistant": i = new Intent(Settings.ACTION_VOICE_INPUT_SETTINGS); break;
                          default: i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + pk));
                      }
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      try {
                          Intent f = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + pk));
                          f.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(f);
                      } catch (Exception e2) {}
                      call.resolve();
                  }
              }
          }
          EOF
          cat > android/app/src/main/java/com/nyra/app/NyraSecure.java <<'EOF'
          package com.nyra.app;
          import android.content.ContentResolver;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.provider.Settings;
          import androidx.core.content.ContextCompat;

          public class NyraSecure {
              static final String PERM = "android.permission.WRITE_SECURE_SETTINGS";

              public static boolean has(Context c) {
                  return ContextCompat.checkSelfPermission(c, PERM) == PackageManager.PERMISSION_GRANTED;
              }

              private static boolean add(Context c, String key, String flat) {
                  ContentResolver cr = c.getContentResolver();
                  String cur = Settings.Secure.getString(cr, key);
                  if (cur == null) cur = "";
                  if (cur.contains(flat)) return true;
                  return Settings.Secure.putString(cr, key, cur.isEmpty() ? flat : cur + ":" + flat);
              }

              /* WRITE_SECURE_SETTINGS mil jaye to Nyra apni accessibility aur notification access khud ON kar leti hai */
              public static boolean ensure(Context c) {
                  if (!has(c)) return false;
                  try {
                      String pk = c.getPackageName();
                      boolean a = add(c, "enabled_accessibility_services", pk + "/" + pk + ".NyraAccessibility");
                      Settings.Secure.putInt(c.getContentResolver(), "accessibility_enabled", 1);
                      add(c, "enabled_notification_listeners", pk + "/" + pk + ".NyraNotifListener");
                      return a;
                  } catch (Exception e) {
                      return false;
                  }
              }
          }
          EOF
