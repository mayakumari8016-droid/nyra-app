              }

              private void setOrb(boolean show) {
                  wantOrb = show;
                  if (!show) {
                      if (ov != null) {
                          try { ov.stop(); wm.removeView(ov); } catch (Exception e) {}
                          ov = null;
                      }
                      return;
                  }
                  if (ov != null) return;
                  try {
                      if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(this)) return;
                      wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                      float d = getResources().getDisplayMetrics().density;
                      int sz = (int) (64 * d);
                      int type = Build.VERSION.SDK_INT >= 26 ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE;
                      lp = new WindowManager.LayoutParams(sz, sz, type,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                      lp.gravity = Gravity.TOP | Gravity.START;
                      lp.x = getResources().getDisplayMetrics().widthPixels - sz - (int) (10 * d);
                      lp.y = (int) (140 * d);
                      ov = new OrbView(this);
                      ov.talk = wantTalk;
                      ov.setOnTouchListener(new View.OnTouchListener() {
                          float dx, dy;
                          int sx, sy;
                          boolean mv;
                          @Override public boolean onTouch(View v, MotionEvent e) {
                              int a = e.getAction();
                              if (a == MotionEvent.ACTION_DOWN) {
                                  dx = e.getRawX(); dy = e.getRawY(); sx = lp.x; sy = lp.y; mv = false;
                                  return true;
                              } else if (a == MotionEvent.ACTION_MOVE) {
                                  float mx = e.getRawX() - dx, my = e.getRawY() - dy;
                                  if (Math.abs(mx) > 12 || Math.abs(my) > 12) mv = true;
                                  if (mv) {
                                      lp.x = sx + (int) mx;
                                      lp.y = sy + (int) my;
                                      try { wm.updateViewLayout(ov, lp); } catch (Exception x) {}
                                  }
                                  return true;
                              } else if (a == MotionEvent.ACTION_UP) {
                                  if (!mv) openApp();
                                  return true;
                              }
                              return false;
                          }
                      });
                      wm.addView(ov, lp);
                      ov.start();
                  } catch (Exception e) {
                      ov = null;
                  }
              }

              private void openApp() {
                  try {
                      Intent i = new Intent(this, MainActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
