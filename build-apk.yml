          /* Background se activity kholna: Android 10+ ise rok deta hai. Isliye: Accessibility se kholo, nahi to upar wali notification (heads-up + full-screen) dikhao */
          public class NyraLaunch {
              public static volatile boolean appVisible = false;
              private static final int NID = 9;

              public static void clear(Context c) {
                  try { ((NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE)).cancel(NID); } catch (Exception e) {}
              }

              /* true = background se seedha kholna shayad Android rok dega */
              public static boolean blocked(Context c) {
                  try {
                      return Build.VERSION.SDK_INT >= 29 && !appVisible && NyraAccessibility.inst == null && !Settings.canDrawOverlays(c);
                  } catch (Exception e) { return false; }
              }

              private static void screenOn(Context c) {
                  try {
                      PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
                      if (pm.isInteractive()) return;
                      PowerManager.WakeLock w = pm.newWakeLock(PowerManager.SCREEN_BRIGHT_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP, "nyra:screen");
                      w.acquire(4000);
                  } catch (Exception e) {}
              }

              private static void notice(final Context c, Intent i, String title, String text) {
                  try {
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= 26) {
                          NotificationChannel ch = new NotificationChannel("nyra_alert", "Nyra alerts", NotificationManager.IMPORTANCE_HIGH);
                          ch.setSound(null, null);
                          nm.createNotificationChannel(ch);
                      }
                      PendingIntent pi = PendingIntent.getActivity(c, 9, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(c, "nyra_alert") : new Notification.Builder(c);
                      b.setContentTitle(title).setContentText(text).setSmallIcon(android.R.drawable.ic_btn_speak_now)
                          .setContentIntent(pi).setFullScreenIntent(pi, true).setAutoCancel(true).setCategory(Notification.CATEGORY_CALL);
                      if (Build.VERSION.SDK_INT < 26) b.setPriority(Notification.PRIORITY_HIGH);
                      nm.notify(NID, b.build());
                      new Handler(Looper.getMainLooper()).postDelayed(new Runnable() { @Override public void run() { clear(c); } }, 12000);
                  } catch (Exception e) {}
              }

              /* force = true: hamesha notification bhi dikhao (Hey Nyra jagane ke liye) */
              public static void go(Context c, Intent i, String title, String text, boolean force) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  if (!appVisible && (force || blocked(c))) { screenOn(c); notice(c, i, title, text); }
                  try {
                      NyraAccessibility a = NyraAccessibility.inst;
                      if (!appVisible && a != null) a.startActivity(i); else c.startActivity(i);
                  } catch (Exception e) {
                      try { c.startActivity(i); } catch (Exception e2) {}
                  }
              }
          }
