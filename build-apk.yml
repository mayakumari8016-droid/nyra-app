          public class NyraTools {
              private static final String NOACC = "Accessibility service on nahi hai. Menu > Permissions me Accessibility me Nyra on karo.";

              private static void sleep(long ms) { try { Thread.sleep(ms); } catch (InterruptedException e) {} }

              public static String run(Context c, String n, JSONObject a) {
                  try {
                      NyraAccessibility ac = NyraAccessibility.inst;
                      switch (n) {
                          case "open_youtube": return yt(c, a.optString("query", ""), false);
                          case "youtube_play": return yt(c, a.optString("query", ""), true);
                          case "open_app": return app(c, a.optString("name", ""));
