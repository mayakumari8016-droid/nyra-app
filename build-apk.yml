          cat > android/app/src/main/java/com/nyra/app/NyraAccessibility.java <<'EOF'
          package com.nyra.app;
          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Path;
          import android.graphics.Rect;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.Display;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import java.io.ByteArrayOutputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class NyraAccessibility extends AccessibilityService {
              public static volatile NyraAccessibility inst;
              public static volatile String lastPkg = "";

              @Override protected void onServiceConnected() { inst = this; }
              @Override public boolean onUnbind(Intent i) { inst = null; return super.onUnbind(i); }
              @Override public void onAccessibilityEvent(AccessibilityEvent e) {
                  if (e != null && e.getPackageName() != null) lastPkg = e.getPackageName().toString();
              }
              @Override public void onInterrupt() {}

              private void collect(AccessibilityNodeInfo n, List<AccessibilityNodeInfo> out, int depth) {
                  if (n == null || out.size() > 1500 || depth > 60) return;
                  out.add(n);
                  for (int i = 0; i < n.getChildCount(); i++) collect(n.getChild(i), out, depth + 1);
              }

              public String dump() {
                  AccessibilityNodeInfo r = getRootInActiveWindow();
                  if (r == null) return "";
                  List<AccessibilityNodeInfo> all = new ArrayList<>();
                  collect(r, all, 0);
                  StringBuilder sb = new StringBuilder("app: " + r.getPackageName() + "\n");
                  Rect b = new Rect();
                  for (AccessibilityNodeInfo n : all) {
                      CharSequence t = n.getText();
                      CharSequence d = n.getContentDescription();
                      String s = (t != null && t.length() > 0) ? t.toString() : (d != null ? d.toString() : "");
                      if (s.isEmpty() || !n.isVisibleToUser()) continue;
                      n.getBoundsInScreen(b);
                      sb.append(n.isClickable() ? "[tap] " : "").append(s.replace("\n", " "))
                        .append(" @").append(b.centerX()).append(",").append(b.centerY()).append("\n");
                      if (sb.length() > 6000) break;
                  }
                  return sb.toString();
              }

              private boolean clickNode(AccessibilityNodeInfo n) {
                  AccessibilityNodeInfo c = n;
                  for (int i = 0; i < 8 && c != null; i++) {
                      if (c.isClickable() && c.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true;
                      c = c.getParent();
                  }
                  Rect b = new Rect();
                  n.getBoundsInScreen(b);
                  return tap(b.centerX(), b.centerY());
              }

              public boolean clickText(String t) {
                  AccessibilityNodeInfo r = getRootInActiveWindow();
                  if (r == null || t == null || t.isEmpty()) return false;
                  List<AccessibilityNodeInfo> l = r.findAccessibilityNodeInfosByText(t);
                  if (l == null) return false;
                  for (AccessibilityNodeInfo n : l) {
                      if (n.isVisibleToUser() && clickNode(n)) return true;
                  }
                  return false;
              }

              /* YouTube search results me sabse upar wala video dabata hai */
              public boolean clickFirstVideo() {
                  AccessibilityNodeInfo r = getRootInActiveWindow();
                  if (r == null) return false;
                  List<AccessibilityNodeInfo> all = new ArrayList<>();
                  collect(r, all, 0);
                  AccessibilityNodeInfo best = null;
                  int bestTop = Integer.MAX_VALUE;
                  Rect b = new Rect();
                  for (AccessibilityNodeInfo n : all) {
                      CharSequence d = n.getContentDescription();
                      if (d == null) continue;
                      String s = d.toString().toLowerCase();
                      boolean video = s.contains("play video") || (s.contains("views") && (s.contains("minute") || s.contains("second")));
                      if (!video || s.contains("sponsored")) continue;
                      n.getBoundsInScreen(b);
                      if (b.height() > 100 && b.top < bestTop) { bestTop = b.top; best = n; }
                  }
                  if (best == null) {
                      int sw = getResources().getDisplayMetrics().widthPixels, sh = getResources().getDisplayMetrics().heightPixels;
                      int top2 = Integer.MAX_VALUE;
                      for (AccessibilityNodeInfo n : all) {
                          if (!n.isVisibleToUser() || !n.isClickable()) continue;
                          n.getBoundsInScreen(b);
                          if (b.width() < sw * 0.6 || b.height() < 180 || b.top < sh * 0.15) continue;
                          if (b.top < top2) { top2 = b.top; best = n; }
                      }
                  }
                  return best != null && clickNode(best);
              }

              public boolean tap(float x, float y) {
                  Path p = new Path();
                  p.moveTo(x, y);
                  GestureDescription g = new GestureDescription.Builder()
                      .addStroke(new GestureDescription.StrokeDescription(p, 0, 60)).build();
                  return dispatchGesture(g, null, null);
              }

              public boolean swipe(float x1, float y1, float x2, float y2) {
                  Path p = new Path();
                  p.moveTo(x1, y1);
                  p.lineTo(x2, y2);
                  GestureDescription g = new GestureDescription.Builder()
                      .addStroke(new GestureDescription.StrokeDescription(p, 0, 300)).build();
                  return dispatchGesture(g, null, null);
              }

              public boolean scroll(boolean down) {
                  int w = getResources().getDisplayMetrics().widthPixels;
                  int h = getResources().getDisplayMetrics().heightPixels;
                  return down ? swipe(w / 2f, h * 0.72f, w / 2f, h * 0.28f) : swipe(w / 2f, h * 0.28f, w / 2f, h * 0.72f);
              }

